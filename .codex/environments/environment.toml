# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "Entorno Sol OS"

[setup]
script = ""

[setup.darwin]
script = '''
set -euo pipefail

echo "==> Preparing Sol OS Runtime v0 Android workspace"

chmod +x ./gradlew

SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

if [ -z "${SDK_DIR}" ]; then
  echo "ERROR: ANDROID_SDK_ROOT or ANDROID_HOME must be configured."
  exit 1
fi

if [ ! -d "${SDK_DIR}" ]; then
  echo "ERROR: Android SDK directory does not exist: ${SDK_DIR}"
  exit 1
fi

printf 'sdk.dir=%s\n' "${SDK_DIR}" > local.properties

echo "==> Java version"
java -version

echo "==> Gradle version"
./gradlew --version

echo "==> Workspace ready"
'''

[[actions]]
name = "Unit tests"
icon = "test"
command = "./gradlew test"

[[actions]]
name = "Lint"
icon = "debug"
command = "./gradlew lint"

[[actions]]
name = "Assemble debug"
icon = "debug"
command = "./gradlew assembleDebug"

[[actions]]
name = "Assemble Android tests"
icon = "test"
command = "./gradlew assembleAndroidTest"

[[actions]]
name = "Connected Android tests"
icon = "test"
command = "./gradlew connectedDebugAndroidTest"

[[actions]]
name = "Security validation"
icon = "run"
command = '''
set -euo pipefail

./gradlew test
./gradlew lint
./gradlew assembleDebug
./gradlew assembleAndroidTest

git status --short
git diff --stat
git diff --check
'''
