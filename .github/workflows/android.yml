name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build_output.txt
        shell: bash

      - name: Surface build errors as annotations
        if: failure()
        run: |
          echo "Extracting compiler errors..."
          grep -E "^e: |error:|FAILURE:|What went wrong|Caused by:|Unresolved reference|> Task .* FAILED" build_output.txt \
            | head -40 \
            | while IFS= read -r line; do
                clean=$(echo "$line" | sed 's/%/%25/g; s/\r//g')
                echo "::error::$clean"
              done
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
